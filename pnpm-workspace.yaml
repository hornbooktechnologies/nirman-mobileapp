packages:
  - "apps/*"
  - "packages/*"

injectWorkspacePackages: true

# Patched compatible transitive releases required by the production audit.
# Keep version ranges scoped so older dependency majors are not replaced.
overrides:
  '@xmldom/xmldom@>=0.8.0 <0.8.15': '0.8.15'
  '@xmldom/xmldom@>=0.9.0 <0.9.12': '0.9.12'
  'baseline-browser-mapping@>=2.0.0 <2.11.0': '2.11.0'
  'body-parser@>=2.0.0 <2.4.0': '2.4.0'
  'brace-expansion@>=5.0.0 <5.0.12': '5.0.12'
  'browserslist@>=4.0.0 <4.28.7': '4.28.7'
  'compression@>=1.0.0 <1.8.2': '1.8.2'
  'follow-redirects@>=1.0.0 <1.16.1': '1.16.1'
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  'multer@>=2.0.0 <2.5.0': '2.5.0'
  'nanoid@>=3.0.0 <3.3.18': '3.3.18'
  'node-forge@>=1.0.0 <1.4.1': '1.4.1'
  'proxy-addr@>=2.0.0 <2.0.8': '2.0.8'
  'qs@>=6.0.0 <6.16.1': '6.16.1'
  'shell-quote@>=1.0.0 <1.11.0': '1.11.0'
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'

allowBuilds:
  '@nestjs/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.3'
  - '@turbo/darwin-arm64@2.11.3'
  - '@turbo/linux-64@2.11.3'
  - '@turbo/linux-arm64@2.11.3'
  - '@turbo/windows-64@2.11.3'
  - '@turbo/windows-arm64@2.11.3'
  - turbo@2.11.3

onlyBuiltDependencies:
  - "@nestjs/core"
  - esbuild
  - sharp
  - unrs-resolver
