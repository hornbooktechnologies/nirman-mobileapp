services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migration:
    build:
      context: .
      target: tools
    restart: "no"
    exclude_from_hc: true
    command: ["bash", "deploy/coolify-migrate.sh"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MIGRATION_APPROVED: ${MIGRATION_APPROVED:?}
    volumes:
      - /home/hornbook/nirmansite/backups:/backups
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
      WEBSITE_ENQUIRY_INGEST_KEY: ${WEBSITE_ENQUIRY_INGEST_KEY:?}
      FRONTEND_URL: https://app.nirmansite.com,https://nirmansite.com
      PUBLIC_WEB_APP_URL: https://app.nirmansite.com
      PUBLIC_ACTIVATION_WEB_URL: https://nirmansite.com/activate
      MOBILE_APP_SCHEME: ${MOBILE_APP_SCHEME:-nirmansite}
      SMTP_HOST: ${API_SMTP_HOST:-}
      SMTP_PORT: ${API_SMTP_PORT:-587}
      SMTP_USERNAME: ${API_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${API_SMTP_PASSWORD:-}
      SMTP_ENCRYPTION: ${API_SMTP_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${API_MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${API_MAIL_FROM_NAME:-NirmanSite}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      NOTIFICATIONS_PUSH_ENABLED: ${NOTIFICATIONS_PUSH_ENABLED:-false}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      target: web
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DESIGN_PREVIEW_ENABLED: "false"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  website:
    build:
      context: .
      target: website
      args:
        WEBSITE_PUBLIC_URL: https://nirmansite.com
        WEBSITE_INDEXING_ENABLED: "true"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000/api/v1
      WEBSITE_ENQUIRY_INGEST_KEY: ${WEBSITE_ENQUIRY_INGEST_KEY:?}
      NEXT_PUBLIC_SITE_URL: https://nirmansite.com
      SITE_INDEXING_ENABLED: "true"
      SMTP_HOST: ${WEBSITE_SMTP_HOST:-}
      SMTP_PORT: ${WEBSITE_SMTP_PORT:-465}
      SMTP_SECURE: ${WEBSITE_SMTP_SECURE:-true}
      SMTP_USER: ${WEBSITE_SMTP_USER:-}
      SMTP_PASS: ${WEBSITE_SMTP_PASS:-}
      SMTP_FROM: ${WEBSITE_SMTP_FROM:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-contact@hornbooktechnologies.com}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
    external: true
    name: nirmansite_mysql_data
