services:
  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
      target: runtime
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-https://api.nirmansite.com}
        WEBSITE_PUBLIC_URL: ${WEBSITE_PUBLIC_URL:-https://nirmansite.com}
        WEBSITE_INDEXING_ENABLED: ${WEBSITE_INDEXING_ENABLED:-true}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: ${API_INTERNAL_URL:-https://api.nirmansite.com}/api/v1
      NEXT_PUBLIC_SITE_URL: ${WEBSITE_PUBLIC_URL:-https://nirmansite.com}
      SITE_INDEXING_ENABLED: ${WEBSITE_INDEXING_ENABLED:-true}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
