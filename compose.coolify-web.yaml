services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-https://api.nirmansite.com}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DESIGN_PREVIEW_ENABLED: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
